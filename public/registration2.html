<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffe599;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            background: #eb4817;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        label {
            font-weight: bold;
            color: #a14f77;
            text-align: left;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        select:focus {
            border-color: #eb4817;
        }

        .submit-btn {
            background: #eb4817;
            color: white;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            border-radius: 6px;
            transition: background 0.3s ease-in-out;
        }

        .submit-btn:hover {
            background: #c73b14;
            transform: translateY(-2px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration Page - Step 2</h2>
        <form action="/submit" method="post" id="registerForm">
            <input type="hidden" id="user_id" name="user_id" value="">

            <label for="event1">Select Event 1:</label>
            <select name="event1" id="event1" required>
                <option disabled selected value="">Select....</option>
                <option value="75+">75+</option>
                <option value="90+">90+</option>
                <!-- <option value="105+">105+</option>
                <option value="120+">120+</option> -->
            </select>

            <label for="partner1">Select Partner 1:</label>
            <select id="partner1" class="partners" name="partner1" required>
                <!-- <option disabled selected value="">Select....</option> -->
                <option value="0">Partner not registered</option>

            </select>

            <label for="event2">Select Event 2:</label>
            <select id="event2" name="event2" required>
                <option disabled selected value="">Select....</option>
                <option value="75+">75+</option>
                <option value="90+">90+</option>
                <!-- <option value="105+">105+</option>
                <option value="120+">120+</option> -->
            </select>

            <label for="partner2">Select Partner 2:</label>
            <select id="partner2" class="partners" name="partner2" required>
                <!-- <option disabled  selected value="">Select....</option> -->
                <option value="0">Partner not registered</option>

            </select>

            <button class="submit-btn" type="submit">Submit</button>
            <!-- <button class="submit-btn" type="button" onclick="window.location.href='index.html'">Submit</button> -->

        </form>
    </div>

</body>

</html>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
     $(document).ready(function () {
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("id");
    let isEditSection = userId?true:false;
    let allusers ;
    // Fetch user data from API
    fetch(`/getUserData/${isEditSection}`) // Replace with your actual API endpoint
        .then(response => response.json()) // Convert response to JSON
        .then(users => {
            console.log('users',users);
            allusers = users.allUsers;
            var partner1 = document.getElementById("partner1");
            var partner2 = document.getElementById("partner2");
            
            if (users.notInPartner1.length) {
                users.notInPartner1.forEach(user => {
                    if (user.id) { // Ensure user has a name
                        let option = document.createElement("option");
                        option.value = user.id;
                        option.textContent = user.name;
                        partner1.appendChild(option);
                    }
                });
            }
            if (users.notInPartner2.length) {
                users.notInPartner2.forEach(user => {
                    if (user.id) { // Ensure user has a name
                        option = document.createElement("option");
                        option.value = user.id;
                        option.textContent = user.name;
                        partner2.appendChild(option);
                    }
                });
            }

        })
        .catch(error => console.error('Error fetching user data:', error));
        
        // Update Event 2 when Event 1 changes
        $('#event1').change(function () {
        const selectedEvent = $(this).val();

        $('#event2 option').each(function () {
            $(this).prop('disabled', $(this).val() === selectedEvent);
        });

        // Reset event2 if the selected option is now disabled
        if ($('#event2').val() === selectedEvent) {
            $('#event2').val('');
        }
        });

        // Update Partner 2 when Partner 1 changes
        // $('#partner1').change(function () {
        //     const selectedPartner = $(this).val();
        //     if (selectedPartner==0) return;

        //     $('#partner2 option').each(function () {
        //     $(this).prop('disabled', $(this).val() === selectedPartner);
        //     });

        //     // Reset partner2 if the selected option is now disabled
        //     if ($('#partner2').val() === selectedPartner) {
        //     $('#partner2').val('');
        //     }
        // });

        
       

        if (userId) {
            $("#user_id").val(userId); // Set the hidden user_id input field

            // Fetch user data
            $.get(`/edit-profile/${userId}`, function (data) {
                const user = data.user;      
                console.log('user',user);
                          
                if (!user) return;

                // Pre-select Event 1 and Event 2
                $("#event1").val(user.p1_event || '').trigger('change');
                $("#event2").val(user.p2_event || '').trigger('change');

                // Wait for partners to load, then set selected partners
                const waitForPartners = setInterval(() => {
                    let partner1 = $("#partner1");
                    let partner2 = $("#partner2");                    

                    if (partner1.find("option").length > 1 && partner2.find("option").length > 1) {
                        clearInterval(waitForPartners);

                        // Set partner1 and partner2 if found
                        if (user.p1_opponent_id) {
                            if(user.p1_opponent_id != 0){
                                allusers.forEach(user => {
                                    if (user.id) { // Ensure user has a name
                                        let option = document.createElement("option");
                                        option.value = user.id;
                                        option.textContent = user.name;
                                        partner1.append(option); // ✅ jQuery method
                                    }
                                });
                            }
                            partner1.val(user.p1_opponent_id.toString());
                            partner1.find('option').each(function () {
                                if ($(this).val() != user.p1_opponent_id && $(this).val() != '0') {
                                    $(this).remove();
                                }
                            });
                        }

                        if (user.p2_opponent_id) {
                            if(user.p2_opponent_id != 0){
                                allusers.forEach(user => {
                                    if (user.id) { // Ensure user has a name
                                        let option = document.createElement("option");
                                        option.value = user.id;
                                        option.textContent = user.name;
                                        partner2.append(option); // ✅ jQuery method
                                    }
                                });
                            }
                            partner2.val(user.p2_opponent_id.toString());
                            partner2.find('option').each(function () {
                                if ($(this).val() != user.p2_opponent_id && $(this).val() != '0') {
                                    $(this).remove();
                                }
                            });
                        }
                    }
                }, 500);
            })
            .fail(function (err) {
                console.error("Error loading user data:", err);
            });
        }
    });

        
        
</script>
