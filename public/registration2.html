<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffe599;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            background: #eb4817;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        label {
            font-weight: bold;
            color: #a14f77;
            text-align: left;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        select:focus {
            border-color: #eb4817;
        }

        .submit-btn {
            background: #eb4817;
            color: white;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            border-radius: 6px;
            transition: background 0.3s ease-in-out;
        }

        .submit-btn:hover {
            background: #c73b14;
            transform: translateY(-2px);
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration Page - Step 2</h2>
        <form action="/submit" method="post" id="registerForm">
            <label for="event1">Select Event 1:</label>
            <select name="event1" id="event1" required>
                <option value="75+">75+</option>x
                <option value="90+">90+</option>
                <option value="105+">105+</option>
                <option value="120+">120+</option>
            </select>

            <label for="partner1">Select Partner 1:</label>
            <select id="partner1" class="partners" name="partner1" required>
                <option disabled selected value="">Select....</option>
            </select>

            <label for="event2">Select Event 2:</label>
            <select id="event2" name="event2" required>
                <option value="75+">75+</option>
                <option value="90+">90+</option>
                <option value="105+">105+</option>
                <option value="120+">120+</option>
            </select>

            <label for="partner2">Select Partner 2:</label>
            <select id="partner2" class="partners" name="partner2" required>
                <option disabled  selected value="">Select....</option>
            </select>

            <button class="submit-btn" type="submit">Submit</button>
            <!-- <button class="submit-btn" type="button" onclick="window.location.href='index.html'">Submit</button> -->

        </form>
    </div>

</body>

</html>

<script>
    // Fetch user data from API
    fetch('/getUserData') // Replace with your actual API endpoint
        .then(response => response.json()) // Convert response to JSON
        .then(users => {

            let partner2 = document.getElementById("partner2");
            let partner1 = document.getElementById("partner1");
            if (users.length) {
                users.forEach(user => {
                    if (user.id) { // Ensure user has a name
                        let option = document.createElement("option");
                        option.value = user.name;
                        option.textContent = user.name;
                        partner1.appendChild(option);

                        option = document.createElement("option");
                        option.value = user.name;
                        option.textContent = user.name;
                        partner2.appendChild(option);
                    }
                });
            } else {
                // Add static option
                const staticOption = document.createElement("option");
                staticOption.value = "Partner not registered"; // or any value you want
                staticOption.textContent = "Partner not registered";
                partner1.appendChild(staticOption); // or use insertBefore if needed

                const staticOption2 = document.createElement("option");
                staticOption2.value = "Partner not registered"; // or any value you want
                staticOption2.textContent = "Partner not registered";
                partner2.appendChild(staticOption2); // or use insertBefore if needed
            }

        })
        .catch(error => console.error('Error fetching user data:', error));
</script>
